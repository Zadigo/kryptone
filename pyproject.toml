[project]
name = "kryptone"
description = "Kryptone is a high level web scraper dedicated to marketers and wrapped around the Selenium library in order to automate and simplify website auditing and scraping."
version="7.8.0"
requires-python = ">=3.14"
readme = "README.md"
keywords = [
  "scraping",
  "data-scraping",
  "web-scraping",
  "selenium",
  "webdriver",
  "automation",
  "crawler",
  "web-crawler",
  "browser-automation",
  "headless-browser",
  "data-extraction",
  "beautifulsoup",
  "requests",
  "parsing",
  "html-parsing",
  "scrapy",
  "http-client",
  "data-mining",
  "api-scraping",
  "dynamic-content",
  "python-scraper",
  "headless-scraping",
  "proxy-rotation",
  "cloudflare-bypass",
  "captcha-solving",
  "async-scraping",
  "distributed-scraping",
  "scraper-bot",
  "phantomjs",
  "webdriver-manager",
  "stealth-scraping",
  "javascript-rendering",
  "selenium-grid",
  "headless-chrome",
  "data-collection",
  "etl",
  "requests-html",
  "lxml",
  "scraping-framework",
  "python-automation"
]
authors = [
  {name = "John Pendenque", email = "pendenquejohn@gmail.com"},
]
maintainers = [
  {name = "John Pendenque", email = "pendenquejohn@gmail.com"}
]
dependencies = [
    "asgiref>=3.11.1",
    "beautifulsoup4>=4.15.0",
    "celery>=5.6.3",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "kaggle>=2.2.3",
    "kagglehub>=1.0.2",
    "lxml>=6.1.1",
    "matplotlib>=3.11.0",
    "nltk>=3.9.4",
    "pandas>=3.0.3",
    "psycopg[binary,pool]>=3.3.4",
    "pyairtable>=3.4.0",
    "pytz>=2026.2",
    "redis>=8.0.1",
    "scikit-learn>=1.9.0",
    "selenium>=4.45.0",
    "twisted>=26.4.0",
    "unidecode>=1.4.0",
    "webdriver-manager>=4.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-aio>=2.1.7",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-datafiles>=3.0.1",
    "pytest-env>=1.6.0",
    "ruff>=0.15.20",
]

[project.urls]
Homepage = "https://github.com/Zadigo/kryptone"
Documentation = "https://github.com/Zadigo/kryptone/wiki"
Repository = "https://github.com/Zadigo/kryptone.git"
Changelog = "https://github.com/Zadigo/kryptone/blob/main/CHANGELOG.md"

[tool.pyright]
typeCheckingMode = "off"
reportMissingImports = true
reportUntypedBaseClass = true

[tool.pytest]
# timeout=5000
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "api: marks tests as api tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.pytest.ini_options]

[tool.pytest_env]
env_files = [".env", ".env.test"]


[tool.autopep8]
max_line_length = 120
# ignore = "E501,W6"  # or ["E501", "W6"]
in-place = true
recursive = true
aggressive = 3
